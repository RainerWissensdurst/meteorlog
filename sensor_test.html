<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Sensor Test mit Kamera</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; background: #000; overflow: hidden;
  font-family: 'Courier New', monospace; color: #eee; }

/* Kamera-Videobild als Vollbild-Hintergrund */
#cam { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; background:#111; }

/* Fadenkreuz in der Mitte */
#cross { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
  width: 80px; height: 80px; z-index: 10; pointer-events: none; }
#cross::before, #cross::after { content:''; position:absolute; background: rgba(78,207,138,0.9); box-shadow:0 0 4px rgba(0,0,0,0.8); }
#cross::before { left:50%; top:0; width:2px; height:100%; margin-left:-1px; }
#cross::after  { top:50%; left:0; height:2px; width:100%; margin-top:-1px; }
.ring { position:absolute; inset:26px; border:2px solid rgba(78,207,138,0.9); border-radius:50%; box-shadow:0 0 4px rgba(0,0,0,0.8); }

/* Werte-Overlay oben */
#top { position: fixed; top:0; left:0; right:0; z-index:20; padding:10px 12px;
  background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent); }
.hdr { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
.hdr .t { color:#4f8eff; font-size:13px; letter-spacing:.1em; }
#mode { padding:3px 8px; border-radius:10px; background:#2a1a1a; color:#ff6b6b; font-size:10px; }
#mode.ok { background:#1a2a1a; color:#4ecf8a; }
.big { display:flex; gap:8px; }
.bigbox { flex:1; background:rgba(10,10,10,0.75); border:1px solid #333; border-radius:8px; padding:6px 10px; text-align:center; }
.bigbox .l { font-size:9px; color:#888; }
.bigbox .v { font-size:22px; color:#7eb3ff; }
.bigbox .v.g { color:#4ecf8a; }

/* Werte-Overlay unten */
#bot { position: fixed; bottom:0; left:0; right:0; z-index:20; padding:10px 12px 16px;
  background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); }
.small { display:flex; gap:5px; margin-bottom:6px; }
.sbox { flex:1; background:rgba(10,10,10,0.7); border:1px solid #2a2a2a; border-radius:6px; padding:4px; text-align:center; }
.sbox .l { font-size:8px; color:#666; }
.sbox .v { font-size:12px; color:#f0b840; }
button { width:100%; padding:13px; background:#4f8eff; border:none; border-radius:10px;
  color:white; font-size:15px; font-family:monospace; cursor:pointer; }
#msg { font-size:11px; color:#aaa; text-align:center; margin-bottom:8px; min-height:15px; line-height:1.5; }
#snap { position:fixed; top:120px; left:50%; transform:translateX(-50%); z-index:30;
  background:rgba(79,142,255,0.95); padding:6px 16px; border-radius:20px; font-size:12px;
  opacity:0; transition:opacity .3s; pointer-events:none; }
#snap.on { opacity:1; }
</style>
</head>
<body>

<video id="cam" autoplay playsinline muted></video>
<div id="cross"><div class="ring"></div></div>
<div id="snap">gespeichert</div>

<div id="top">
  <div class="hdr">
    <span class="t">KAMERA-SENSOR-TEST</span>
    <span id="mode">nicht gestartet</span>
  </div>
  <div class="big">
    <div class="bigbox"><div class="l">AZIMUT</div><div class="v" id="az">—</div></div>
    <div class="bigbox"><div class="l">ELEVATION</div><div class="v g" id="el">—</div></div>
  </div>
</div>

<div id="bot">
  <div id="msg">Fadenkreuz auf Ziel richten, dann ablesen</div>
  <div class="small">
    <div class="sbox"><div class="l">qW</div><div class="v" id="qw">—</div></div>
    <div class="sbox"><div class="l">qX</div><div class="v" id="qx">—</div></div>
    <div class="sbox"><div class="l">qY</div><div class="v" id="qy">—</div></div>
    <div class="sbox"><div class="l">qZ</div><div class="v" id="qz">—</div></div>
  </div>
  <div class="small">
    <div class="sbox"><div class="l">wx</div><div class="v" id="wx">—</div></div>
    <div class="sbox"><div class="l">wy</div><div class="v" id="wy">—</div></div>
    <div class="sbox"><div class="l">wz</div><div class="v" id="wz">—</div></div>
  </div>
  <button id="startBtn">STARTEN (Kamera + Sensoren)</button>
</div>

<script>
function quatRotate(q, v) {
  const [qw,qx,qy,qz] = q;
  const [vx,vy,vz] = v;
  const tx = 2*(qy*vz - qz*vy);
  const ty = 2*(qz*vx - qx*vz);
  const tz = 2*(qx*vy - qy*vx);
  return [
    vx + qw*tx + qy*tz - qz*ty,
    vy + qw*ty + qz*tx - qx*tz,
    vz + qw*tz + qx*ty - qy*tx
  ];
}

// Kamera-Blickrichtung im Geräte-KS
// Verifiziert gegen 3 Kompass-Messungen (Nord, Ost, 45°-hoch)
const CAM_AXIS = [0, -1, 0];

let lastQuat = null;

function setMode(t, ok){ const m=document.getElementById('mode'); m.textContent=t; m.className=ok?'ok':''; }
function setMsg(t){ document.getElementById('msg').textContent=t; }

function showQuat(q) {
  lastQuat = q;
  document.getElementById('qw').textContent=q[0].toFixed(3);
  document.getElementById('qx').textContent=q[1].toFixed(3);
  document.getElementById('qy').textContent=q[2].toFixed(3);
  document.getElementById('qz').textContent=q[3].toFixed(3);
  const [wx,wy,wz]=quatRotate(q, CAM_AXIS);
  document.getElementById('wx').textContent=wx.toFixed(3);
  document.getElementById('wy').textContent=wy.toFixed(3);
  document.getElementById('wz').textContent=wz.toFixed(3);
  // Verifiziertes Welt-KS: Ost=+Z, Nord=X, Oben=-Y
  const az=((Math.atan2(wz, wx)*180/Math.PI)+360)%360;
  const el=Math.asin(Math.max(-1,Math.min(1,-wy)))*180/Math.PI;
  document.getElementById('az').textContent=az.toFixed(1)+'°';
  document.getElementById('el').textContent=el.toFixed(1)+'°';
}

async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' }, audio: false
    });
    document.getElementById('cam').srcObject = stream;
    return true;
  } catch(err) {
    setMsg('Kamera nicht verfügbar: ' + err.message + ' — Test läuft ohne Bild weiter.');
    return false;
  }
}

async function startSensors() {
  // iOS permission
  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    try { await DeviceOrientationEvent.requestPermission(); } catch(e){}
  }
  let ok = false;
  if (typeof AbsoluteOrientationSensor !== 'undefined') {
    try {
      const perms = await Promise.all([
        navigator.permissions.query({name:'accelerometer'}),
        navigator.permissions.query({name:'gyroscope'}),
        navigator.permissions.query({name:'magnetometer'})
      ]);
      if (perms.every(p=>p.state!=='denied')) {
        const s = new AbsoluteOrientationSensor({frequency:30, referenceFrame:'device'});
        s.addEventListener('reading', ()=>{ setMode('AbsOriSensor',true); showQuat(s.quaternion); });
        s.addEventListener('error', ()=> setMode('Sensor-Fehler',false));
        s.start();
        ok = true;
      }
    } catch(e){}
  }
  if (!ok) {
    setMode('kein Quaternion',false);
    setMsg('AbsoluteOrientationSensor nicht verfügbar. Nutze Chrome/Ecosia auf dem Handy.');
  }
}

document.getElementById('startBtn').addEventListener('click', async () => {
  document.getElementById('startBtn').textContent = 'läuft…';
  await startCamera();
  await startSensors();
  setMsg('Fadenkreuz auf Ziel richten. Werte oben ablesen.');
  document.getElementById('startBtn').style.display = 'none';
});
</script>
</body>
</html>
